name: Fresh Windows install
run-name: Fresh install / ${{ inputs.sha256 }}
on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: Private draft-release candidate ZIP asset ID
        required: true
        type: string
      sha256:
        description: Exact candidate ZIP SHA256
        required: true
        type: string
permissions:
  # GitHub requires write-level access to read unpublished draft-release assets.
  # This manually dispatched workflow only downloads/tests; it never publishes.
  contents: write
jobs:
  fresh-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download exact private candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ASSET: ${{ inputs.asset_id }}
          CANDIDATE_SHA: ${{ inputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_ASSET -notmatch '^\d+$' -or $env:CANDIDATE_SHA -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid candidate inputs.' }
          $headers = @{Authorization="Bearer $env:GH_TOKEN";Accept='application/octet-stream';'X-GitHub-Api-Version'='2022-11-28'}
          $zip = Join-Path $env:RUNNER_TEMP 'candidate.zip'
          Invoke-WebRequest "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$env:CANDIDATE_ASSET" -Headers $headers -OutFile $zip
          if ((Get-FileHash $zip).Hash -ne $env:CANDIDATE_SHA) { throw 'Candidate ZIP hash mismatch.' }
      - name: Build matching diagnostic executable
        shell: pwsh
        run: ./build.ps1 -OutputName JonsboStudio.Update.exe
      - name: Test fresh installation on this new Windows VM
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'fresh-install-results'
          New-Item -ItemType Directory -Path $report -Force | Out-Null
          Start-Transcript (Join-Path $report 'tests.log')
          try { ./Test-PortableRelease.ps1 -Zip (Join-Path $env:RUNNER_TEMP 'candidate.zip') -RequireCleanMachine -ReportDirectory $report }
          finally { Stop-Transcript }
      - name: Collect startup diagnostics
        if: always()
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'fresh-install-results'
          New-Item -ItemType Directory -Path $report -Force | Out-Null
          $log = Join-Path $env:LOCALAPPDATA 'JonsboStudio\Logs\startup.log'
          if (Test-Path $log) { Copy-Item $log (Join-Path $report 'startup.log') }
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsName,OsArchitecture | ConvertTo-Json | Set-Content (Join-Path $report 'environment.json')
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fresh-windows-install-evidence
          path: ${{ runner.temp }}/fresh-install-results/
          if-no-files-found: warn
